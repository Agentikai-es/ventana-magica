# Apache delante de Ventana Mágica en un VPS Linux (Ubuntu/Debian).
#
#   móvil ──HTTPS──▶ Apache (:443, certificado Let's Encrypt) ──HTTP──▶ Node (127.0.0.1:8080)
#
# scripts/instalar-vps.sh cambia DOMINIO por el tuyo, activa los módulos (proxy, proxy_http, headers)
# y ejecuta «certbot --apache», que copia este bloque a :443 con el certificado y redirige :80 → HTTPS.

<VirtualHost *:80>
    ServerName DOMINIO

    # Node no ve el HTTPS: se lo decimos (cookies Secure) y solo pasa la IP real del móvil
    # (si el cliente manda su propio X-Forwarded-For, se borra y Apache añade la verdadera).
    RequestHeader set X-Forwarded-Proto "%{REQUEST_SCHEME}s"
    RequestHeader unset X-Forwarded-For

    ProxyPreserveHost On
    ProxyRequests Off
    # Tiempo real (SSE, /api/eventos): sin buffer ni compresión; Node manda un latido cada 25 s.
    ProxyTimeout 120
    ProxyPass        / http://127.0.0.1:8080/ flushpackets=on
    ProxyPassReverse / http://127.0.0.1:8080/
    SetEnvIf Request_URI "^/api/eventos" no-gzip=1

    # Vídeos y GIF de hasta 40 MB (Node vuelve a limitar cada tipo: fotos 6 MB, audio 3 MB).
    LimitRequestBody 45000000

    ErrorLog ${APACHE_LOG_DIR}/ventana-error.log
    CustomLog ${APACHE_LOG_DIR}/ventana-access.log combined
</VirtualHost>
