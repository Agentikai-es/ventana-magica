<script>
// ---------- Lápiz: trazos temblorosos y deterministas ----------
const NS = 'http://www.w3.org/2000/svg';
let semilla = 7;
const azar = () => { semilla = (semilla * 16807) % 2147483647; return semilla / 2147483647; };
const tiembla = (v, a = 1.6) => v + (azar() - 0.5) * 2 * a;
const TINTA = '#1e2a78', ROJO = '#c0392b', VERDE = '#2e7d4f', NARANJA = '#d9822b', MORADO = '#6a4fb3';

function nodo(svg, tag, attrs, texto) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (texto != null) e.textContent = texto;
  svg.appendChild(e);
  return e;
}
function linea(svg, x1, y1, x2, y2, { color = TINTA, ancho = 2.2, pasadas = 2 } = {}) {
  for (let p = 0; p < pasadas; p++) {
    const mx = (x1 + x2) / 2 + (azar() - 0.5) * 3, my = (y1 + y2) / 2 + (azar() - 0.5) * 3;
    nodo(svg, 'path', { d: `M${tiembla(x1)} ${tiembla(y1)} Q${mx} ${my} ${tiembla(x2)} ${tiembla(y2)}`, fill: 'none', stroke: color, 'stroke-width': p ? ancho * 0.6 : ancho, 'stroke-linecap': 'round', opacity: p ? 0.55 : 0.95 });
  }
}
function caja(svg, x, y, w, h, { color = TINTA, relleno = null, ancho = 2.4 } = {}) {
  if (relleno) nodo(svg, 'path', { d: `M${tiembla(x + 3)} ${tiembla(y + 3)} L${tiembla(x + w - 2)} ${tiembla(y + 2)} L${tiembla(x + w - 3)} ${tiembla(y + h - 2)} L${tiembla(x + 2)} ${tiembla(y + h - 3)}Z`, fill: relleno, opacity: 0.55 });
  linea(svg, x, y, x + w + 4, y, { color, ancho });
  linea(svg, x + w, y - 3, x + w, y + h + 2, { color, ancho });
  linea(svg, x + w + 3, y + h, x - 2, y + h, { color, ancho });
  linea(svg, x, y + h + 3, x, y - 2, { color, ancho });
}
function flecha(svg, x1, y1, x2, y2, { color = TINTA, texto, dx = 0, dy = -8, tam = 15, doble = false } = {}) {
  linea(svg, x1, y1, x2, y2, { color, ancho: 2 });
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const punta = (x, y, a) => {
    linea(svg, x, y, x - 13 * Math.cos(a - 0.45), y - 13 * Math.sin(a - 0.45), { color, ancho: 2, pasadas: 1 });
    linea(svg, x, y, x - 13 * Math.cos(a + 0.45), y - 13 * Math.sin(a + 0.45), { color, ancho: 2, pasadas: 1 });
  };
  punta(x2, y2, ang);
  if (doble) punta(x1, y1, ang + Math.PI);
  if (texto) escribe(svg, (x1 + x2) / 2 + dx, (y1 + y2) / 2 + dy, texto, { tam, color, centro: true });
}
function escribe(svg, x, y, texto, { tam = 17, color = TINTA, centro = false, gira = 0, peso = 400, clase = '' } = {}) {
  const lineas = String(texto).split('\n');
  lineas.forEach((l, i) => nodo(svg, 'text', {
    x, y: y + i * tam * 1.22, 'font-size': tam, fill: color, 'text-anchor': centro ? 'middle' : 'start', 'font-weight': peso,
    transform: gira ? `rotate(${gira} ${x} ${y})` : '', class: clase,
  }, l));
}
function rotulo(svg, x, y, w, h, titulo, sub, opts = {}) {
  caja(svg, x, y, w, h, opts);
  escribe(svg, x + w / 2, y + (sub ? h / 2 - 4 : h / 2 + 8), titulo, { tam: opts.tam || 26, centro: true, color: opts.color || TINTA, clase: 't' });
  if (sub) escribe(svg, x + w / 2, y + h / 2 + 20, sub, { tam: opts.subtam || 14, centro: true, color: opts.color || TINTA });
}
function subraya(svg, x, y, w, color = TINTA) { linea(svg, x, y, x + w, y + 2, { color, ancho: 2.6 }); }
function titulo(svg, texto, sub) {
  escribe(svg, 70, 62, texto, { tam: 38, clase: 't' });
  subraya(svg, 70, 74, texto.length * 15.5);
  if (sub) escribe(svg, 72, 102, sub, { tam: 17, color: '#4a4f80' });
  escribe(svg, 1050, 770, 'Ventana Mágica · 25 nov 2026 · datos ficticios', { tam: 12, color: '#7a7fa8', gira: 0 }).textContent;
}
function circulo(svg, cx, cy, r, color = ROJO) {
  nodo(svg, 'ellipse', { cx: tiembla(cx), cy: tiembla(cy), rx: r * 1.08, ry: r * 0.92, fill: 'none', stroke: color, 'stroke-width': 2, transform: `rotate(${(azar() - 0.5) * 12} ${cx} ${cy})` });
}
function nota(svg, x, y, w, h, texto, { color = '#fff3b0', tam = 14 } = {}) {
  nodo(svg, 'rect', { x, y, width: w, height: h, fill: color, transform: `rotate(${(azar() - 0.5) * 3} ${x + w / 2} ${y + h / 2})`, opacity: 0.95 });
  escribe(svg, x + 10, y + 22, texto, { tam, color: '#3b3b3b' });
}
function pie(svg, n) { escribe(svg, 1080, 772, `${n}/4`, { tam: 14, color: '#7a7fa8' }); escribe(svg, 70, 772, 'Ventana Mágica · diagrama de funcionamiento · 25 nov 2026 · todo con datos ficticios', { tam: 12, color: '#7a7fa8' }); }

  const pant = [['Ventana', 'móvil del niño', 680, 440], ['Enviar', 'familia y clase', 680, 510], ['Aprobar', 'adulto de confianza', 680, 580], ['Panel', 'personal del hospital', 680, 650]];
  for (const [t, sub, x, y] of pant) { rotulo(s, x + 110, y - 10, 170, 50, t, sub, { tam: 20, subtam: 12 }); }
  flecha(s, 642, 500, 785, 455, {}); flecha(s, 642, 508, 785, 525, {}); flecha(s, 642, 518, 785, 595, {}); flecha(s, 642, 528, 785, 662, {});
  escribe(s, 650, 440, 'tiempo real (SSE)', { tam: 13 });

  // Flujo entrada → voz → texto → salida (como en el boceto)
  const fx = 1000;
  rotulo(s, fx, 432, 100, 36, 'entrada', null, { tam: 18 });
  linea(s, fx + 50, 470, fx + 50, 484);
  escribe(s, fx + 50, 502, 'voz', { tam: 19, centro: true });
