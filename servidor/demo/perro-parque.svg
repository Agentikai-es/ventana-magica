<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <!-- Foto FICTICIA de la demo: «Toby en el parque», dibujada a mano en SVG (sin fotos reales).
       Pensada para un puzle 3×3 fácil: cada casilla de 300×300 tiene algo distinto y reconocible. -->
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fa7e8"/><stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <linearGradient id="cesped" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc95a"/><stop offset="1" stop-color="#3f9a3a"/>
    </linearGradient>
    <pattern id="hierba" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M6 30 l4-14 l4 14 M22 34 l3-12 l3 12" stroke="#2f7d2c" stroke-width="3" fill="none" stroke-linecap="round"/>
    </pattern>
  </defs>

  <!-- Cielo y césped -->
  <rect width="900" height="900" fill="url(#cielo)"/>
  <path d="M0 470 Q220 420 450 455 T900 440 V900 H0Z" fill="url(#cesped)"/>
  <path d="M0 470 Q220 420 450 455 T900 440 V900 H0Z" fill="url(#hierba)" opacity=".55"/>

  <!-- Arriba izquierda: SOL grande con rayos -->
  <g transform="translate(140 140)">
    <g stroke="#ffb400" stroke-width="14" stroke-linecap="round">
      <line x1="0" y1="-118" x2="0" y2="-88"/><line x1="0" y1="88" x2="0" y2="118"/>
      <line x1="-118" y1="0" x2="-88" y2="0"/><line x1="88" y1="0" x2="118" y2="0"/>
      <line x1="-84" y1="-84" x2="-62" y2="-62"/><line x1="62" y1="62" x2="84" y2="84"/>
      <line x1="84" y1="-84" x2="62" y2="-62"/><line x1="-62" y1="62" x2="-84" y2="84"/>
    </g>
    <circle r="70" fill="#ffd23f" stroke="#ffb400" stroke-width="8"/>
    <circle cx="-22" cy="-10" r="8" fill="#7a4a00"/><circle cx="22" cy="-10" r="8" fill="#7a4a00"/>
    <path d="M-28 18 Q0 44 28 18" stroke="#7a4a00" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Arriba centro: NUBE blanca y COMETA roja -->
  <g transform="translate(450 120)">
    <g fill="#fff"><circle cx="-60" cy="20" r="42"/><circle cx="-10" cy="-4" r="56"/><circle cx="50" cy="16" r="44"/><rect x="-100" y="20" width="190" height="44" rx="22"/></g>
  </g>
  <g transform="translate(470 230) rotate(-12)">
    <path d="M0 -50 L38 0 L0 50 L-38 0Z" fill="#e53950" stroke="#8c1028" stroke-width="5"/>
    <path d="M0 -50 V50 M-38 0 H38" stroke="#ffd23f" stroke-width="5"/>
    <path d="M0 50 q-14 24 6 40 q18 14 -2 36" stroke="#8c1028" stroke-width="4" fill="none"/>
  </g>

  <!-- Arriba derecha: copa del ÁRBOL con manzanas rojas -->
  <g transform="translate(760 210)">
    <circle cx="-70" cy="20" r="80" fill="#2e8b3a"/><circle cx="30" cy="-40" r="95" fill="#37a046"/><circle cx="70" cy="60" r="80" fill="#2e8b3a"/>
    <g fill="#e53935" stroke="#9b1b1b" stroke-width="3">
      <circle cx="-40" cy="-10" r="16"/><circle cx="40" cy="-60" r="16"/><circle cx="80" cy="30" r="16"/><circle cx="-90" cy="50" r="16"/><circle cx="20" cy="40" r="16"/>
    </g>
  </g>

  <!-- Centro izquierda: TOBOGÁN amarillo y azul -->
  <g transform="translate(60 330)">
    <rect x="30" y="20" width="14" height="230" fill="#1e5fbf"/><rect x="110" y="20" width="14" height="230" fill="#1e5fbf"/>
    <g fill="#1e5fbf"><rect x="30" y="70" width="94" height="10"/><rect x="30" y="130" width="94" height="10"/><rect x="30" y="190" width="94" height="10"/></g>
    <rect x="22" y="0" width="112" height="26" rx="8" fill="#ff7a1a"/>
    <path d="M124 20 C180 60 190 170 250 240 L222 252 C170 190 150 90 110 40Z" fill="#ffd23f" stroke="#c98a00" stroke-width="5"/>
  </g>

  <!-- Centro: CABEZA del PERRO marrón con orejas largas -->
  <g transform="translate(450 470)">
    <ellipse cx="-92" cy="10" rx="40" ry="86" fill="#6b3d1e" transform="rotate(18 -92 10)"/>
    <ellipse cx="92" cy="10" rx="40" ry="86" fill="#6b3d1e" transform="rotate(-18 92 10)"/>
    <ellipse cx="0" cy="0" rx="104" ry="110" fill="#c47a3c"/>
    <ellipse cx="0" cy="48" rx="62" ry="50" fill="#f1d3a6"/>
    <circle cx="-38" cy="-22" r="16" fill="#fff"/><circle cx="38" cy="-22" r="16" fill="#fff"/>
    <circle cx="-34" cy="-20" r="9" fill="#1b1b1b"/><circle cx="42" cy="-20" r="9" fill="#1b1b1b"/>
    <ellipse cx="0" cy="24" rx="22" ry="15" fill="#1b1b1b"/>
    <path d="M0 40 V58 M-26 58 Q0 82 26 58" stroke="#1b1b1b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M-12 66 Q0 104 12 66Z" fill="#ff5a7a"/>
  </g>

  <!-- Centro derecha: TRONCO del árbol y CASITA de pájaros azul -->
  <g transform="translate(700 300)">
    <path d="M40 0 H110 L124 300 H26Z" fill="#7a4a24"/>
    <path d="M60 40 q-8 60 6 120 M92 80 q10 60 -4 140" stroke="#5a3418" stroke-width="6" fill="none"/>
    <g transform="translate(75 120)">
      <path d="M-46 0 L0 -44 L46 0Z" fill="#e53950"/>
      <rect x="-38" y="0" width="76" height="70" fill="#2f7fe0" stroke="#174a8c" stroke-width="5"/>
      <circle cx="0" cy="32" r="16" fill="#0d2440"/>
    </g>
  </g>

  <!-- Abajo izquierda: FLORES rosas y moradas -->
  <g transform="translate(150 760)">
    <g stroke="#2f7d2c" stroke-width="7"><line x1="-80" y1="20" x2="-80" y2="120"/><line x1="0" y1="0" x2="0" y2="120"/><line x1="80" y1="30" x2="80" y2="120"/></g>
    <g transform="translate(-80 10)" fill="#ff5fa2"><circle cx="0" cy="-26" r="20"/><circle cx="24" cy="-6" r="20"/><circle cx="14" cy="22" r="20"/><circle cx="-14" cy="22" r="20"/><circle cx="-24" cy="-6" r="20"/><circle r="14" fill="#ffd23f"/></g>
    <g transform="translate(0 -12)" fill="#8e5bd8"><circle cx="0" cy="-26" r="22"/><circle cx="26" cy="-6" r="22"/><circle cx="16" cy="24" r="22"/><circle cx="-16" cy="24" r="22"/><circle cx="-26" cy="-6" r="22"/><circle r="15" fill="#fff3b0"/></g>
    <g transform="translate(80 18)" fill="#ff5fa2"><circle cx="0" cy="-24" r="18"/><circle cx="22" cy="-6" r="18"/><circle cx="12" cy="20" r="18"/><circle cx="-12" cy="20" r="18"/><circle cx="-22" cy="-6" r="18"/><circle r="12" fill="#ffd23f"/></g>
  </g>

  <!-- Abajo centro: CUERPO del perro con COLLAR rojo y placa -->
  <g transform="translate(450 662)">
    <ellipse cx="0" cy="40" rx="120" ry="110" fill="#c47a3c"/>
    <ellipse cx="0" cy="70" rx="64" ry="70" fill="#f1d3a6"/>
    <rect x="-84" y="-78" width="168" height="26" rx="13" fill="#e01f3d"/>
    <circle cx="0" cy="-34" r="20" fill="#ffd23f" stroke="#c98a00" stroke-width="5"/>
    <ellipse cx="-70" cy="150" rx="40" ry="24" fill="#a8622d"/><ellipse cx="70" cy="150" rx="40" ry="24" fill="#a8622d"/>
  </g>

  <!-- Abajo derecha: PELOTA de rayas y charco azul -->
  <g transform="translate(760 760)">
    <ellipse cx="0" cy="70" rx="120" ry="36" fill="#5fb6ff" stroke="#2f7fe0" stroke-width="5"/>
    <circle cx="0" cy="0" r="62" fill="#fff" stroke="#1b1b1b" stroke-width="5"/>
    <path d="M-62 0 H62" stroke="#e53950" stroke-width="20"/>
    <path d="M-50 -36 Q0 -10 50 -36" stroke="#2f7fe0" stroke-width="14" fill="none"/>
    <path d="M-50 36 Q0 10 50 36" stroke="#2f7fe0" stroke-width="14" fill="none"/>
  </g>
</svg>
