<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900">
  <!-- Foto FICTICIA de la demo: «La clase de 3.º B» dibujada en SVG (sin fotos reales ni niños reales).
       Puzle 3×3 fácil: cada casilla de 300×300 tiene algo distinto y reconocible. -->
  <rect width="900" height="900" fill="#fbe9c8"/>
  <rect y="620" width="900" height="280" fill="#c98b52"/>
  <g stroke="#b37740" stroke-width="4"><line x1="0" y1="700" x2="900" y2="700"/><line x1="0" y1="790" x2="900" y2="790"/><line x1="150" y1="620" x2="150" y2="900"/><line x1="450" y1="620" x2="450" y2="900"/><line x1="750" y1="620" x2="750" y2="900"/></g>

  <!-- Arriba izq + centro: PIZARRA verde con el mensaje -->
  <rect x="30" y="40" width="560" height="250" rx="14" fill="#7a4a24"/>
  <rect x="48" y="58" width="524" height="214" rx="8" fill="#2e6b4f"/>
  <text x="170" y="150" font-family="Marker Felt, Comic Sans MS, sans-serif" font-size="74" fill="#fff" text-anchor="middle">¡Hola</text>
  <text x="440" y="150" font-family="Marker Felt, Comic Sans MS, sans-serif" font-size="74" fill="#ffd23f" text-anchor="middle">Leo!</text>
  <text x="310" y="238" font-family="Marker Felt, Comic Sans MS, sans-serif" font-size="44" fill="#bfe6ff" text-anchor="middle">te esperamos ♥</text>
  <rect x="80" y="276" width="70" height="12" rx="4" fill="#fff"/>

  <!-- Arriba derecha: VENTANA con sol y RELOJ -->
  <g transform="translate(650 40)">
    <rect width="210" height="170" rx="10" fill="#7fc8f8" stroke="#fff" stroke-width="12"/>
    <line x1="105" y1="0" x2="105" y2="170" stroke="#fff" stroke-width="10"/><line x1="0" y1="85" x2="210" y2="85" stroke="#fff" stroke-width="10"/>
    <circle cx="160" cy="45" r="26" fill="#ffd23f"/>
    <path d="M10 160 Q60 120 110 150 T210 140 V170 H10Z" fill="#5bb36a"/>
  </g>
  <g transform="translate(755 260)">
    <circle r="34" fill="#fff" stroke="#e53950" stroke-width="8"/>
    <line x1="0" y1="0" x2="0" y2="-22" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/><line x1="0" y1="0" x2="16" y2="6" stroke="#1b1b1b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Centro izquierda: ESTANTERÍA con libros de colores -->
  <g transform="translate(40 330)">
    <rect width="220" height="260" fill="#8d5a2b"/>
    <rect x="12" y="12" width="196" height="110" fill="#5c3a1a"/><rect x="12" y="136" width="196" height="110" fill="#5c3a1a"/>
    <g><rect x="20" y="30" width="28" height="92" fill="#e53950"/><rect x="52" y="22" width="24" height="100" fill="#2f7fe0"/><rect x="80" y="36" width="30" height="86" fill="#ffd23f"/><rect x="114" y="26" width="22" height="96" fill="#5bb36a"/><rect x="140" y="40" width="30" height="82" fill="#8e5bd8"/><rect x="174" y="30" width="26" height="92" fill="#ff8a3d"/></g>
    <g><rect x="20" y="150" width="34" height="96" fill="#5bb36a"/><rect x="58" y="160" width="26" height="86" fill="#ff5fa2"/><rect x="88" y="146" width="30" height="100" fill="#2f7fe0"/><circle cx="160" cy="210" r="34" fill="#ffd23f" stroke="#c98a00" stroke-width="5"/></g>
  </g>

  <!-- Centro: DIBUJO de un corazón con las manos de la clase -->
  <g transform="translate(450 470)">
    <rect x="-130" y="-140" width="260" height="250" fill="#fff" stroke="#d8c7a8" stroke-width="6" transform="rotate(-4)"/>
    <path d="M0 70 C-120 -10 -90 -110 0 -50 C90 -110 120 -10 0 70Z" fill="#ff5a7a"/>
    <g fill="#2f7fe0"><circle cx="-80" cy="-100" r="16"/><circle cx="80" cy="-100" r="16"/></g>
    <g fill="#5bb36a"><circle cx="-95" cy="60" r="16"/><circle cx="95" cy="60" r="16"/></g>
    <rect x="-24" y="-150" width="48" height="20" fill="#ffd23f" opacity=".8" transform="rotate(-4)"/>
  </g>

  <!-- Centro derecha: BOLA DEL MUNDO -->
  <g transform="translate(760 470)">
    <path d="M-50 110 H50" stroke="#7a4a24" stroke-width="14" stroke-linecap="round"/><line x1="0" y1="110" x2="0" y2="76" stroke="#7a4a24" stroke-width="10"/>
    <circle r="74" fill="#4fa7e8" stroke="#c98a00" stroke-width="8"/>
    <path d="M-40 -40 q20 -20 40 0 q10 20 -10 30 q-20 10 -30 -30Z M10 10 q30 -10 40 20 q-10 30 -40 20Z M-50 20 q15 10 10 30 q-20 0 -10 -30Z" fill="#5bb36a"/>
  </g>

  <!-- Abajo izquierda: PUPITRE con lápices -->
  <g transform="translate(40 690)">
    <rect width="230" height="34" rx="6" fill="#ffb86b"/>
    <rect x="16" y="34" width="14" height="150" fill="#555"/><rect x="200" y="34" width="14" height="150" fill="#555"/>
    <g transform="translate(60 -40)"><rect width="70" height="44" rx="6" fill="#fff"/><path d="M6 12h58M6 24h46" stroke="#9aa" stroke-width="4"/></g>
    <g transform="translate(150 -60)"><rect width="16" height="60" fill="#e53950"/><rect x="22" width="16" height="60" fill="#2f7fe0"/><rect x="44" width="16" height="60" fill="#5bb36a"/></g>
  </g>

  <!-- Abajo centro: MOCHILA roja -->
  <g transform="translate(450 760)">
    <rect x="-90" y="-80" width="180" height="200" rx="40" fill="#e01f3d"/>
    <rect x="-60" y="10" width="120" height="70" rx="16" fill="#ff5a7a"/>
    <path d="M-50 -80 q50 -60 100 0" stroke="#8c1028" stroke-width="16" fill="none"/>
    <circle cx="0" cy="44" r="12" fill="#ffd23f"/>
  </g>

  <!-- Abajo derecha: PLANTA en maceta y PELOTA -->
  <g transform="translate(720 760)">
    <path d="M-50 20 H50 L38 110 H-38Z" fill="#ff8a3d"/>
    <path d="M0 20 C-10 -60 -70 -60 -80 -100 M0 20 C10 -70 60 -70 80 -110 M0 20 V-120" stroke="#2f7d2c" stroke-width="8" fill="none"/>
    <g fill="#5bb36a"><ellipse cx="-80" cy="-100" rx="26" ry="14"/><ellipse cx="80" cy="-110" rx="26" ry="14"/><ellipse cx="0" cy="-124" rx="16" ry="26"/></g>
    <circle cx="120" cy="80" r="30" fill="#ffd23f" stroke="#8e5bd8" stroke-width="8"/>
  </g>
</svg>
